
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des Catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800">

    <main class="max-w-6xl mx-auto p-6 md:p-10">

        <!-- En-tête -->
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">

            <div>
                <h1 class="text-3xl font-bold text-gray-900">
                    Gestion des Catégories
                </h1>

                <p class="text-gray-500 mt-2">
                    Gérer les catégories des articles de mode
                </p>
            </div>

            <button
                type="button"
                id="btn-ajouter"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-3 rounded-lg shadow-sm transition">
                + Nouvelle catégorie
            </button>

        </div>

        <!-- Formulaire -->
        <div
            id="div_form"
            class="p-6 bg-white mb-8 rounded-xl shadow-sm border border-gray-200 hidden">

            <h2 class="text-xl font-bold mb-6 text-gray-900">
                Ajouter une catégorie
            </h2>

            <form id="form-categorie" class="space-y-4">

                <div>
                    <label for="nom"
                        class="block mb-2 font-medium text-gray-700">
                        Nom de la catégorie
                    </label>

                    <input
                        type="text"
                        name="nom"
                        id="nom"
                        placeholder="Ex : Robes"
                        required
                        class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="description"
                        class="block mb-2 font-medium text-gray-700">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Description de la catégorie"
                        required
                        class="w-full border border-gray-300 p-3 rounded-lg resize-y focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Boutons -->
                <div class="flex flex-wrap gap-3 pt-3">

                    <button
                        type="submit"
                        id="btn-submit"
                        class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium px-5 py-2.5 rounded-lg transition">

                        <span id="btn-text">Enregistrer</span>

                        <span id="spinner" class="hidden ml-2">
                            ⏳
                        </span>

                    </button>

                    <button
                        type="button"
                        id="btn-annuler"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-5 py-2.5 rounded-lg transition">
                        Annuler
                    </button>

                </div>

            </form>
        </div>

        <!-- Tableau -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

            <div class="p-5 border-b border-gray-200">
                <h2 class="text-lg font-bold text-gray-900">
                    Liste des catégories
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    Retrouvez toutes les catégories enregistrées.
                </p>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="p-4 text-sm font-semibold uppercase">
                                ID
                            </th>

                            <th class="p-4 text-sm font-semibold uppercase">
                                Nom
                            </th>

                            <th class="p-4 text-sm font-semibold uppercase">
                                Description
                            </th>
                        </tr>
                    </thead>

                    <tbody
                        id="tbody"
                        class="divide-y divide-gray-100">

                    </tbody>

                </table>

            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-sm text-gray-400 mt-8">
            Gestion des catégories — Blog Spartel
        </footer>

    </main>

    <!-- Toasts -->
    <div
        id="toast-container"
        class="fixed top-4 right-4 z-50 space-y-2">
    </div>

    <script src="/frontend/assets/app.js"></script>

</body>
</html>
