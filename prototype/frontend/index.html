<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des Catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <main class="flex-1 p-8">
        <div class="flex justify-between mb-8">
            <div>
                <h2 class="text-3xl font-bold">
                    Gestion des Catégories
                </h2>
                <p class="text-gray-500 mt-2">
                    Gérer les catégories des articles de mode
                </p>
            </div>
             <button
                id="btn-ajouter"
                class="bg-blue-600 text-white px-5 py-3">
                + Nouvelle catégorie
            </button>
        </div>
        <!-- Formulaire -->
        <div
            id="section_form"
            class="p-6 bg-white mb-4 hidden">
            <h3 class="text-xl font-bold mb-6">
                Ajouter une catégorie
            </h3>
            <form id="form-categorie">
                <label
                    for="nom"
                    class="block mb-2">
                    Nom de la catégorie
                </label>
                <input
                    type="text"
                    id="nom"
                    placeholder="Ex : Robes"
                    class="w-full border p-3 mb-4"
                    required>
                <label
                    for="description"
                    class="block mb-2">
                    Description
                </label>
                <textarea
                    id="description"
                    placeholder="Description de la catégorie"
                    class="w-full border p-3 mb-4"
                    required></textarea>
                <button
                    type="submit"
                    class="bg-blue-600 text-white px-5 py-2">
                    Enregistrer
                </button>
                <button
                    type="button"
                    id="btn-annuler"
                    class="bg-gray-400 text-white px-5 py-2">Annuler</button>
            </form>
        </div>
        <!-- Tableau -->
        <div class="bg-white">
            <table class="w-full">
                <thead class="bg-gray-800 text-white">
                   <tr>
                        <th class="p-4 text-left">
                            ID
                        </th>

                        <th class="p-4 text-left">
                            Nom
                        </th>

                        <th class="p-4 text-left">
                            Description
                        </th>
                    </tr>
                </thead>
                <tbody id="table-categorie">
                    <!-- Les catégories seront ajoutées ici avec JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="categories.js"></script>

</body>
</html>
